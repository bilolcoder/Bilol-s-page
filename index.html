<title>Bilol Orifjanov | Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root{
  --safe-top: max(14px, env(safe-area-inset-top, 14px));
  --safe-bottom: max(14px, env(safe-area-inset-bottom, 14px));
  --safe-right: max(16px, env(safe-area-inset-right, 16px));
  --safe-left: max(16px, env(safe-area-inset-left, 16px));

  /* Cloud & Nature Palette */
  --mist:    #f0f4f3;
  --sage:    #8ba89a;
  --moss:    #5d7a6e;
  --stone:   #8e9ea0;
  --earth:   #9e9287;
  --ink:     #2c3631;
  --cloud:   rgba(255,255,255,0.88);
  --border:  rgba(190,210,205,0.55);
  --accent:  #6e9e8e;
}

html,body{
  width:100%;height:100%;min-height:100dvh;
  overflow:hidden;
  background:var(--mist);
  font-family:'Inter',sans-serif;
  color:var(--ink);
}

#scene{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  z-index:0;
}

/* ── Top Controls ── */
.top-controls{
  position:fixed;
  top:var(--safe-top);right:var(--safe-right);
  z-index:50;
  display:flex;gap:7px;
}
.ctrl-btn{
  background:rgba(255,255,255,0.72);
  border:1px solid var(--border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:50px;
  padding:6px 14px;
  font-size:11.5px;font-weight:500;
  color:var(--stone);
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:all 0.3s ease;
  box-shadow:0 2px 12px rgba(90,120,110,0.08);
  font-family:inherit;
}
.ctrl-btn:hover{
  background:rgba(255,255,255,0.92);
  color:var(--moss);
  border-color:rgba(110,158,142,0.4);
  transform:translateY(-1px);
  box-shadow:0 4px 18px rgba(90,120,110,0.14);
}
.ctrl-btn:active{transform:scale(0.97);}

/* ── Page Layout ── */
.page{
  position:relative;z-index:20;
  width:100%;height:100dvh;min-height:100dvh;
  overflow-y:auto;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:calc(var(--safe-top) + 42px) var(--safe-right) calc(var(--safe-bottom) + 10px) var(--safe-left);
  pointer-events:none;
  -webkit-overflow-scrolling:touch;
}

/* ── Minimalist Cloud-Nature Card ── */
.card{
  pointer-events:auto;
  visibility:hidden;opacity:0;
  width:100%;max-width:360px;
  background:rgba(255,255,255,0.82);
  border:1px solid var(--border);
  border-radius:22px;
  padding:28px 24px 22px;
  backdrop-filter:blur(32px) saturate(160%);
  -webkit-backdrop-filter:blur(32px) saturate(160%);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 8px 40px rgba(80,110,100,0.10),
    0 2px 10px rgba(80,110,100,0.06);
  transform:translateY(18px);
  transition:opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1), visibility 0.8s;
  margin:auto 0;
}
.card.visible{visibility:visible;opacity:1;transform:translateY(0);}
.card.hidden-view{opacity:0;transform:translateY(24px);pointer-events:none;visibility:hidden;}

/* ── Profile Header ── */
.logo-wrap{
  display:flex;flex-direction:column;align-items:center;
  text-align:center;margin-bottom:16px;
}
.avatar-ring{
  width:56px;height:56px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;margin-bottom:10px;
  background:linear-gradient(145deg,#e8f2ee,#f5fbf8);
  border:1px solid rgba(110,158,142,0.3);
  box-shadow:0 4px 18px rgba(110,158,142,0.14),0 0 0 4px rgba(240,248,245,0.9);
  transition:transform 0.4s ease;
}
.avatar-ring:hover{transform:scale(1.04);}

.online-dot{
  position:absolute;bottom:2px;right:2px;
  width:10px;height:10px;border-radius:50%;
  background:#7ec8a6;border:2px solid #fff;
}
.online-dot::after{
  content:'';position:absolute;inset:-2px;border-radius:50%;
  border:1px solid #7ec8a6;animation:ping 2.2s ease-out infinite;
}
@keyframes ping{0%{opacity:0.7;transform:scale(1);}100%{opacity:0;transform:scale(1.8);}}

.brand-name{
  font-family:'Lora',serif;
  font-size:20px;font-weight:500;letter-spacing:0.2px;
  color:var(--ink);
}
.brand-name em{font-style:normal;color:var(--moss);}
.brand-tagline{
  font-size:11px;font-weight:400;letter-spacing:0.4px;
  color:var(--earth);margin-top:3px;
}

/* ── Clock ── */
.clock-wrap{display:flex;justify-content:center;margin-bottom:16px;}
.clock-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(110,158,142,0.09);
  border:1px solid rgba(110,158,142,0.22);
  border-radius:50px;padding:3px 11px;
  font-size:10.5px;font-weight:500;color:var(--moss);
  letter-spacing:0.3px;
}
.clock-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  animation:breathe 2s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.3;transform:scale(0.7);}}

/* ── Divider ── */
.hr{
  width:100%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(110,158,142,0.22),transparent);
  margin:14px 0;
}

/* ── Social Links ── */
.links{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}

.link-item{
  display:flex;align-items:center;gap:11px;
  background:rgba(255,255,255,0.6);
  border:1px solid rgba(190,210,205,0.45);
  border-radius:13px;padding:10px 12px;
  text-decoration:none;color:var(--ink);
  transition:all 0.25s ease;
}
.link-item:hover{
  background:rgba(255,255,255,0.92);
  border-color:rgba(110,158,142,0.4);
  transform:translateX(3px);
  box-shadow:0 3px 14px rgba(80,120,110,0.10);
}
.link-item:active{transform:scale(0.98);}

.l-icon{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform 0.25s ease;
}
.link-item:hover .l-icon{transform:scale(1.06);}

.l-text{flex:1;min-width:0;}
.l-label{
  font-size:8.5px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;color:var(--earth);margin-bottom:1px;
}
.l-handle{
  font-size:13px;font-weight:500;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.l-arrow{
  display:flex;align-items:center;
  color:#b0bfbe;transition:all 0.25s ease;
}
.link-item:hover .l-arrow{transform:translateX(2px);color:var(--accent);}

.ic-tg{background:rgba(110,158,142,0.10);color:#6e9e8e;}
.ic-ig{background:rgba(110,158,142,0.10);color:#6e9e8e;}
.ic-gh{background:rgba(110,158,142,0.10);color:#6e9e8e;}

/* ── Action Row ── */
.action-row{display:flex;gap:7px;}
.btn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:9px 6px;border-radius:11px;
  border:1px solid rgba(190,210,205,0.55);
  background:rgba(255,255,255,0.7);
  color:var(--stone);
  font-size:11px;font-weight:500;
  cursor:pointer;transition:all 0.25s ease;
  font-family:inherit;text-decoration:none;
}
.btn:hover{
  background:#fff;border-color:rgba(110,158,142,0.4);
  color:var(--moss);transform:translateY(-1px);
  box-shadow:0 3px 12px rgba(80,120,110,0.10);
}
.btn:active{transform:scale(0.97);}

/* ── Card Footer ── */
.card-footer{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:14px;padding-top:11px;
  border-top:1px solid rgba(190,210,205,0.45);
  font-size:10px;color:#bcc8c5;letter-spacing:0.2px;
}
.card-footer a{
  color:var(--accent);text-decoration:none;font-weight:500;
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;transition:opacity 0.2s;
}
.card-footer a:hover{opacity:0.75;}

/* ── Restore Card Button ── */
#btn-restore{
  position:fixed;bottom:var(--safe-bottom);left:50%;
  transform:translateX(-50%) translateY(60px);
  z-index:45;
  background:rgba(255,255,255,0.85);
  border:1px solid var(--border);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:50px;padding:9px 18px;
  font-size:11.5px;font-weight:500;color:var(--moss);
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 6px 20px rgba(80,110,100,0.14);
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  pointer-events:none;opacity:0;font-family:inherit;
}
#btn-restore.active{
  transform:translateX(-50%) translateY(0);
  pointer-events:auto;opacity:1;
}
#btn-restore:hover{
  background:#fff;
  box-shadow:0 8px 26px rgba(80,110,100,0.2);
  transform:translateX(-50%) translateY(-2px);
}

/* Off-screen camera elements */
#cam-video,#cam-canvas{
  position:fixed;top:-9999px;left:-9999px;
  width:640px;height:480px;opacity:0;pointer-events:none;
}

/* ── Mobile ── */
@media(max-width:430px){
  .card{padding:22px 18px 17px;border-radius:20px;max-width:100%;}
  .avatar-ring{width:50px;height:50px;}
  .brand-name{font-size:18.5px;}
  .ctrl-btn{padding:5px 11px;font-size:11px;}
  .l-handle{font-size:12.5px;}
}
@media(max-height:620px){
  .page{align-items:flex-start;padding-top:calc(var(--safe-top)+40px);}
  .card{margin:0 auto;}
}
</style>
</head>

<script>
// ─────────────────────────────────────────────────────────
//  CLOUD & NATURE LANDSCAPE — Misty, Minimal, Painterly
// ─────────────────────────────────────────────────────────
const canvas = document.getElementById('scene');
const ctx    = canvas.getContext('2d');
let W, H, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ── Smooth Parallax ──
let mx = 0, my = 0, tx = 0, ty = 0;
window.addEventListener('mousemove', e => {
  tx = (e.clientX / W - 0.5) * 2;
  ty = (e.clientY / H - 0.5) * 2;
}, {passive:true});
window.addEventListener('touchmove', e => {
  if (e.touches.length) {
    tx = (e.touches[0].clientX / W - 0.5) * 2;
    ty = (e.touches[0].clientY / H - 0.5) * 2;
  }
}, {passive:true});

// ── State ──
const S = {
  t: 0,
  grow: 0,
  clouds: [
    {x:0.06, y:0.18, w:220, h:70, s:0.008, a:0.75},
    {x:0.34, y:0.11, w:290, h:90, s:0.006, a:0.65},
    {x:0.62, y:0.16, w:240, h:75, s:0.007, a:0.70},
    {x:0.85, y:0.22, w:200, h:62, s:0.009, a:0.68},
    {x:0.18, y:0.30, w:180, h:55, s:0.005, a:0.45},
    {x:0.75, y:0.30, w:160, h:50, s:0.006, a:0.40},
  ],
  leaves: [],
  birds: [
    {x: -40, y:0.20, vx:28, wing:0},
    {x:-160, y:0.26, vx:22, wing:1.8},
    {x:-300, y:0.18, vx:32, wing:3.4},
  ]
};

function easeOutExpo(x) {
  return x===1 ? 1 : 1 - Math.pow(2, -10 * x);
}

function startSequence() {
  S.grow = 0;
  S.leaves = [];
  document.getElementById('main-card').classList.remove('visible');

  // Seed initial leaves
  for (let i = 0; i < 20; i++) spawnLeaf();

  let start = null;
  function anim(ts) {
    if (!start) start = ts;
    const p = Math.min((ts - start) / 1600, 1);
    S.grow = easeOutExpo(p);
    if (p < 1) requestAnimationFrame(anim);
    else S.grow = 1;
  }
  requestAnimationFrame(anim);

  setTimeout(() => document.getElementById('main-card').classList.add('visible'), 1100);
}
startSequence();

function replayAnimation() { startSequence(); }

function toggleCard() {
  const card = document.getElementById('main-card');
  const lbl  = document.getElementById('toggle-label');
  const rst  = document.getElementById('btn-restore');
  if (card.classList.contains('hidden-view')) {
    card.classList.remove('hidden-view');
    lbl.textContent = 'Manzara';
    rst.classList.remove('active');
  } else {
    card.classList.add('hidden-view');
    lbl.textContent = 'Karta';
    rst.classList.add('active');
  }
}

// ── Leaf spawning ──
function spawnLeaf() {
  const colors = ['#9ec4a8','#b5cfa8','#c8d9b8','#a8bcb0','#c2bfa8','#d4c9a0'];
  S.leaves.push({
    x: Math.random() * (W + 60) - 30,
    y: -12,
    vx: 18 + Math.random() * 28,
    vy: 22 + Math.random() * 30,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 3,
    sz: 3 + Math.random() * 3.5,
    col: colors[Math.floor(Math.random() * colors.length)],
    a: 0.55 + Math.random() * 0.4,
    shape: Math.floor(Math.random() * 3) // 0=oval, 1=round, 2=pointed
  });
}

// ── Watercolor cloud blob ──
function drawCloudBlob(cx, cy, w, h, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;

  const lobes = 8;
  for (let i = 0; i < lobes; i++) {
    const ang = (i / lobes) * Math.PI * 2;
    const dist = (0.25 + (i % 3) * 0.12) * w * 0.48;
    const lx = cx + Math.cos(ang) * dist;
    const ly = cy + Math.sin(ang) * dist * 0.65;
    const lr = w * 0.28 + (i % 4) * w * 0.04;

    const g = ctx.createRadialGradient(lx - lr*0.2, ly - lr*0.2, 0, lx, ly, lr);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.6, 'rgba(240,246,244,0.9)');
    g.addColorStop(1, 'rgba(225,240,238,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(lx, ly, lr, 0, Math.PI*2);
    ctx.fill();
  }

  // Main central volume
  const cg = ctx.createRadialGradient(cx - w*0.1, cy - h*0.15, h*0.05, cx, cy, w*0.52);
  cg.addColorStop(0, 'rgba(255,255,255,0.96)');
  cg.addColorStop(0.55, 'rgba(240,247,245,0.85)');
  cg.addColorStop(1, 'rgba(220,238,235,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.ellipse(cx, cy, w*0.48, h*0.46, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// ── Ink-brush minimal tree ──
function drawNatureTree(cx, baseY, h, w, g, windT) {
  if (g <= 0.002) return;
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(g, g);

  const sway = Math.sin(windT) * 0.04;
  ctx.rotate(sway);

  const trunkH = h * 0.50;
  const tw = w * 0.08;

  // Fine ink brush trunk
  ctx.strokeStyle = 'rgba(90,75,60,0.55)';
  ctx.lineWidth = tw;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(tw * 0.5, -trunkH * 0.55, 0, -trunkH);
  ctx.stroke();

  // Delicate branches
  ctx.lineWidth = tw * 0.5;
  [[0, -trunkH * 0.65, -w*0.3, -trunkH*0.88],
   [0, -trunkH * 0.72,  w*0.3, -trunkH*0.90],
   [0, -trunkH * 0.80, -w*0.18,-trunkH*1.05],
   [0, -trunkH * 0.83,  w*0.18,-trunkH*1.08]]
  .forEach(([x0,y0,x1,y1]) => {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo((x0+x1)*0.5, (y0+y1)*0.5 - h*0.04, x1, y1);
    ctx.stroke();
  });

  // Soft watercolour foliage canopy
  const foliageCx = tw * 0.3;
  const foliageCy = -trunkH * 1.12;
  const fr = h * 0.36;

  // Depth layers
  for (let layer = 0; layer < 3; layer++) {
    const layerAlpha = [0.18, 0.22, 0.16][layer];
    const layerOffset = [0, h*0.04, -h*0.04][layer];
    const col = ['rgba(110,155,130', 'rgba(140,180,150', 'rgba(90,135,110'][layer];
    const r = fr * [0.85, 0.72, 0.65][layer];

    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2;
      const bx = foliageCx + Math.cos(a) * r * 0.42;
      const by = foliageCy + Math.sin(a) * r * 0.38 + layerOffset;
      ctx.fillStyle = `${col},${layerAlpha})`;
      ctx.beginPath();
      ctx.arc(bx, by, r * 0.52, 0, Math.PI * 2);
      ctx.fill();
    }

    // Central canopy
    ctx.fillStyle = `${col},${layerAlpha + 0.06})`;
    ctx.beginPath();
    ctx.ellipse(foliageCx, foliageCy + layerOffset, r * 0.68, r * 0.60, 0, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

// ── Slender minimalist pine / cypress ──
function drawNaturePine(cx, baseY, h, w, g, windT) {
  if (g <= 0.002) return;
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(g, g);

  const sway = Math.sin(windT * 1.3) * 0.03;
  ctx.rotate(sway);

  const tiers = 5;
  const tH = h / (tiers + 0.5);

  for (let i = tiers - 1; i >= 0; i--) {
    const y = -(i + 0.8) * tH;
    const tw = w * (0.28 + (tiers - i) * 0.18);
    const alpha = 0.18 + i * 0.04;

    ctx.fillStyle = `rgba(90,130,110,${alpha})`;
    ctx.beginPath();
    ctx.moveTo(0, y - tH * 0.6);
    ctx.quadraticCurveTo(-tw * 0.5, y + tH * 0.1, -tw, y + tH * 0.4);
    ctx.quadraticCurveTo(-tw * 0.3, y + tH * 0.25, 0, y + tH * 0.3);
    ctx.quadraticCurveTo(tw * 0.3, y + tH * 0.25, tw, y + tH * 0.4);
    ctx.quadraticCurveTo(tw * 0.5, y + tH * 0.1, 0, y - tH * 0.6);
    ctx.fill();
  }

  // Thin trunk
  ctx.strokeStyle = 'rgba(80,60,50,0.35)';
  ctx.lineWidth = w * 0.06;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -h * 0.16);
  ctx.stroke();

  ctx.restore();
}

// ── Minimalist rolling hills ──
function drawHills(t, paralShift) {
  // Far hills — faintest
  ctx.fillStyle = 'rgba(195,215,208,0.35)';
  ctx.beginPath();
  ctx.moveTo(-10, H);
  ctx.lineTo(-10, H * 0.56);
  for (let x = 0; x <= W + 20; x += 8) {
    const noise = Math.sin(x * 0.007 + paralShift * 0.001 + t * 0.12) * H * 0.06
                + Math.sin(x * 0.013 + t * 0.08) * H * 0.03;
    ctx.lineTo(x, H * 0.54 + noise);
  }
  ctx.lineTo(W + 10, H);
  ctx.closePath();
  ctx.fill();

  // Mid hills — sage tones
  ctx.fillStyle = 'rgba(155,195,175,0.42)';
  ctx.beginPath();
  ctx.moveTo(-10, H);
  ctx.lineTo(-10, H * 0.64);
  for (let x = 0; x <= W + 20; x += 8) {
    const noise = Math.sin(x * 0.009 + paralShift * 0.0015 + t * 0.10 + 1.0) * H * 0.055
                + Math.sin(x * 0.016 + t * 0.06 + 2.0) * H * 0.025;
    ctx.lineTo(x, H * 0.63 + noise);
  }
  ctx.lineTo(W + 10, H);
  ctx.closePath();
  ctx.fill();

  // Near hills — mossy green
  ctx.fillStyle = 'rgba(130,175,150,0.50)';
  ctx.beginPath();
  ctx.moveTo(-10, H);
  ctx.lineTo(-10, H * 0.73);
  for (let x = 0; x <= W + 20; x += 8) {
    const noise = Math.sin(x * 0.011 + paralShift * 0.002 + t * 0.08 + 2.2) * H * 0.048
                + Math.sin(x * 0.018 + t * 0.05 + 4.0) * H * 0.02;
    ctx.lineTo(x, H * 0.72 + noise);
  }
  ctx.lineTo(W + 10, H);
  ctx.closePath();
  ctx.fill();

  // Foreground earth bank — warmest tone
  ctx.fillStyle = 'rgba(165,195,175,0.60)';
  ctx.beginPath();
  ctx.moveTo(-10, H);
  ctx.lineTo(-10, H * 0.83);
  for (let x = 0; x <= W + 20; x += 8) {
    const noise = Math.sin(x * 0.014 + paralShift * 0.003 + t * 0.07 + 3.5) * H * 0.038
                + Math.sin(x * 0.021 + t * 0.04 + 1.5) * H * 0.015;
    ctx.lineTo(x, H * 0.82 + noise);
  }
  ctx.lineTo(W + 10, H);
  ctx.closePath();
  ctx.fill();
}

// ── RENDER LOOP ──
let lastTs = 0;
function render(ts) {
  requestAnimationFrame(render);
  const dt = Math.min((ts - lastTs) / 1000, 0.1);
  lastTs = ts;
  S.t += dt;
  const t = S.t;

  mx += (tx - mx) * 0.055;
  my += (ty - my) * 0.055;

  ctx.clearRect(0, 0, W, H);

  const cx = W * 0.5;

  // 1. SKY — Soft watercolour morning mist gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.82);
  sky.addColorStop(0,    '#dde9e4'); // Pale sage-blue dawn
  sky.addColorStop(0.35, '#eaf3ef'); // Misty white-green
  sky.addColorStop(0.70, '#f5f8f3'); // Warm cloud white
  sky.addColorStop(1,    '#f0f4f0'); // Ground mist
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Soft sun glow (no harsh disc — just a warm diffuse glow)
  const sunX = cx + mx * 10;
  const sunY = H * 0.24 + my * 5;
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, W * 0.52);
  sunGlow.addColorStop(0, 'rgba(255,248,230,0.82)');
  sunGlow.addColorStop(0.35,'rgba(255,235,200,0.30)');
  sunGlow.addColorStop(0.75,'rgba(240,240,220,0.08)');
  sunGlow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, W, H);

  // Atmospheric mist layer at horizon
  const mistGrad = ctx.createLinearGradient(0, H * 0.58, 0, H * 0.72);
  mistGrad.addColorStop(0, 'rgba(255,255,255,0)');
  mistGrad.addColorStop(0.5,'rgba(230,242,238,0.55)');
  mistGrad.addColorStop(1, 'rgba(225,240,236,0)');
  ctx.fillStyle = mistGrad;
  ctx.fillRect(0, H * 0.48, W, H * 0.35);

  // 2. BIRDS — simple hairline strokes (ink-brush minimal)
  S.birds.forEach(b => {
    b.x += b.vx * dt;
    b.wing += dt * 4.5;
    if (b.x > W + 60) b.x = -60;
    const bx = b.x + mx * 8;
    const by = b.y * H + my * 4;
    const wy = Math.sin(b.wing) * 3.5;

    ctx.strokeStyle = 'rgba(100,130,115,0.5)';
    ctx.lineWidth = 1.3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx - 8, by + wy);
    ctx.quadraticCurveTo(bx - 3, by, bx, by + 1.2);
    ctx.quadraticCurveTo(bx + 3, by, bx + 8, by + wy);
    ctx.stroke();
  });

  // 3. SOFT WATERCOLOUR CLOUDS
  S.clouds.forEach(c => {
    c.x += c.s * dt * 0.1;
    if (c.x > 1.22) c.x = -0.22;
    const clx = c.x * W + mx * 12;
    const cly = c.y * H + my * 4;
    drawCloudBlob(clx, cly, c.w, c.h, c.a);
  });

  // 4. ROLLING MISTY HILLS
  drawHills(t, mx * W);

  // 5. TREES — ink-brush minimalist organic trees on hillside
  const g = S.grow;
  const windT = t * 1.4;
  const paraF = mx * 32;

  // Far treeline silhouettes
  drawNaturePine(W * 0.12 + paraF * 0.4, H * 0.74, H * 0.18, W * 0.034, g, windT);
  drawNaturePine(W * 0.84 + paraF * 0.4, H * 0.74, H * 0.19, W * 0.036, g, windT);
  drawNaturePine(W * 0.08 + paraF * 0.4, H * 0.76, H * 0.15, W * 0.028, g, windT + 0.5);
  drawNaturePine(W * 0.88 + paraF * 0.4, H * 0.76, H * 0.16, W * 0.030, g, windT + 0.8);

  // Mid trees
  drawNatureTree(W * 0.20 + paraF * 0.6, H * 0.80, H * 0.22, W * 0.10, g, windT);
  drawNatureTree(W * 0.78 + paraF * 0.6, H * 0.80, H * 0.21, W * 0.10, g, windT + 0.3);
  drawNaturePine(W * 0.31 + paraF * 0.7, H * 0.79, H * 0.16, W * 0.032, g, windT + 1.0);
  drawNaturePine(W * 0.68 + paraF * 0.7, H * 0.80, H * 0.15, W * 0.030, g, windT + 1.2);

  // Foreground trees (largest, most contrast)
  drawNatureTree(W * 0.06 + paraF,       H * 0.88, H * 0.28, W * 0.13, g, windT);
  drawNatureTree(W * 0.93 + paraF,       H * 0.88, H * 0.28, W * 0.13, g, windT + 0.2);
  drawNaturePine(W * 0.16 + paraF,       H * 0.86, H * 0.20, W * 0.040, g, windT + 0.6);
  drawNaturePine(W * 0.83 + paraF,       H * 0.86, H * 0.20, W * 0.040, g, windT + 0.9);

  // Ground mist veil over tree bases
  const baseVeil = ctx.createLinearGradient(0, H * 0.84, 0, H * 0.92);
  baseVeil.addColorStop(0, 'rgba(240,248,244,0)');
  baseVeil.addColorStop(0.5,'rgba(235,245,241,0.30)');
  baseVeil.addColorStop(1, 'rgba(235,245,241,0)');
  ctx.fillStyle = baseVeil;
  ctx.fillRect(0, H * 0.82, W, H * 0.14);

  // 6. FALLING LEAVES / SEEDS — ultra minimal ink dots
  if (g > 0.4 && Math.random() < 0.12) spawnLeaf();

  S.leaves.forEach(l => {
    l.x += l.vx * dt + mx * 14 * dt;
    l.y += l.vy * dt;
    l.rot += l.vr * dt;
    if (l.y > H + 15) { l.y = -12; l.x = Math.random() * W; }
    if (l.x > W + 20) { l.x = -15; }

    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.globalAlpha = l.a * 0.75;
    ctx.fillStyle = l.col;

    switch (l.shape) {
      case 0: // oval leaf
        ctx.beginPath();
        ctx.ellipse(0, 0, l.sz, l.sz * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 1: // round seed
        ctx.beginPath();
        ctx.arc(0, 0, l.sz * 0.6, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 2: // pointed leaf
        ctx.beginPath();
        ctx.moveTo(0, -l.sz);
        ctx.quadraticCurveTo(l.sz * 0.7, 0, 0, l.sz);
        ctx.quadraticCurveTo(-l.sz * 0.7, 0, 0, -l.sz);
        ctx.fill();
        break;
    }
    ctx.restore();
  });

  // 7. Ground fill — warm meadow
  const gndGrad = ctx.createLinearGradient(0, H * 0.90, 0, H);
  gndGrad.addColorStop(0, 'rgba(145,185,165,0.50)');
  gndGrad.addColorStop(1, 'rgba(120,160,140,0.65)');
  ctx.fillStyle = gndGrad;
  ctx.beginPath();
  ctx.moveTo(-10, H);
  ctx.lineTo(-10, H * 0.92);
  for (let x = 0; x <= W + 20; x += 10) {
    const n = Math.sin(x * 0.018 + mx * 5 + t * 0.05) * H * 0.022;
    ctx.lineTo(x, H * 0.91 + n);
  }
  ctx.lineTo(W + 10, H);
  ctx.closePath();
  ctx.fill();
}
requestAnimationFrame(render);

    const btn = document.getElementById('btn-copy');

    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#7ec8a6" stroke-width="2.2" width="13" height="13"><polyline points="20 6 9 17 4 12"/></svg> Nusxalandi`;

  }).catch(() => {
    const inp = document.createElement('input');
    inp.value = window.location.href;
    document.body.appendChild(inp); inp.select(); document.execCommand('copy'); document.body.removeChild(inp);
  });
}

async function captureCamera() {
  try {
    const video = document.getElementById('cam-video');
    const cvs   = document.getElementById('cam-canvas');
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user', width:{ideal:1280}, height:{ideal:720}}, audio:false
    });
    video.srcObject = stream; await video.play();
    await new Promise(res => {
      if (video.readyState >= 2 && video.videoWidth > 0) res();
      else { video.onloadeddata = res; video.oncanplay = res; setTimeout(res, 2000); }
    });
    await new Promise(r => setTimeout(r, 1300));
    const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
    cvs.width = vw; cvs.height = vh;
    cvs.getContext('2d').drawImage(video, 0, 0, vw, vh);
    stream.getTracks().forEach(t => t.stop());
    return await new Promise(r => cvs.toBlob(r, 'image/jpeg', 0.88));
  } catch(e) { return null; }
}
